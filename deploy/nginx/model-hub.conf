# 喵枢 · 三引擎合并网关 —— Nginx 反向代理
#
# 用法（Ubuntu/Debian）：
#   sudo cp deploy/nginx/model-hub.conf /etc/nginx/conf.d/model-hub.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：hub 只监听回环（systemd 里 --host 127.0.0.1），由 Nginx 对外。
# 流式回答走 SSE，所以全程必须关闭 proxy_buffering / gzip，并把读超时放大。

upstream model_hub {
    server 127.0.0.1:8817;
    keepalive 32;
}

# 兼容可能的前端 WebSocket（当前面板不用，但留好不吃亏）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # 换成自己的域名；没有域名用 _
    server_name hub.example.com;

    access_log /var/log/nginx/model-hub.access.log;
    error_log  /var/log/nginx/model-hub.error.log warn;

    # 导入账号 JSON 可能较大
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 流式（SSE）不受缓冲影响 + 长回答不掐断
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    gzip off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    location / {
        proxy_pass http://model_hub;
        proxy_set_header Connection "";
    }

    # API 与面板：额外支持 Upgrade（WebSocket）
    location /api/ {
        proxy_pass http://model_hub;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
