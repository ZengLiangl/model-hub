<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0ec" />
    <title>喵枢 · 三引擎合并网关</title>
    <script>
      // 首帧前定主题：避免"先白后黑"的闪烁（FOUC）。
      // 三态：light / dark / system（默认 system，跟随系统）。
      (function () {
        try {
          var saved = localStorage.getItem("hub-theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var mode = (saved === "light" || saved === "dark") ? saved : (sysDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", mode);
          // 主题色也跟着走，否则移动端地址栏颜色会和页面打架
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#1b1e1c" : "#eef0ec");
        } catch (e) {}
      })();
    </script>
